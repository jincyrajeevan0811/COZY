{% extends "accounts/_auth_simple.html" %}
{% block title %}Password updated | {{ site.site_name }}{% endblock %}
{% block auth_body %}
<div class="text-center">
  <div class="success-mark"><i class="bi bi-check-lg"></i></div>
  <h1 class="h2">Password updated</h1>
  <p class="text-muted">You can now sign in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-cozy">Sign in</a>
</div>
{% endblock %}
