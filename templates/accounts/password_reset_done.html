{% extends "accounts/_auth_simple.html" %}
{% block title %}Check your inbox | {{ site.site_name }}{% endblock %}
{% block auth_body %}
<div class="text-center">
  <div class="success-mark"><i class="bi bi-envelope-check"></i></div>
  <h1 class="h2">Check your inbox</h1>
  <p class="text-muted">If an account exists for that email, a password reset link is on its way. The link expires in a few days.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-cozy">Back to sign in</a>
</div>
{% endblock %}
