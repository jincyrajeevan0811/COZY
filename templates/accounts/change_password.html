{% extends "accounts/account_base.html" %}
{% block title %}Change password | {{ site.site_name }}{% endblock %}
{% block account_content %}
<h1 class="h2 mb-4">Change password</h1>
<form class="card-cozy" method="post" novalidate style="max-width:560px">
  {% csrf_token %}
  {% for field in form %}{% include "base/_field.html" %}{% endfor %}
  <button class="btn btn-cozy">Update password</button>
</form>
{% endblock %}
