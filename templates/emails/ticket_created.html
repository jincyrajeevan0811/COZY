{% extends "emails/base_email.html" %}
{% block body %}
<h1 style="font-family:Georgia,serif;font-weight:normal;color:#2B2B2B;">We've got your message</h1>
<p>Hi {{ name }},</p>
<p>Thanks for reaching out. Your request <strong>{{ ticket.ticket_number }}</strong> — “{{ ticket.subject }}” — has been created. Our team will get back to you shortly.</p>
{% endblock %}
