{% extends "emails/base_email.html" %}
{% block body %}
<h1 style="font-family:Georgia,serif;font-weight:normal;color:#2B2B2B;font-size:24px;">{{ title }}</h1>

<p>{{ message|linebreaksbr }}</p>
{% if link %}{% include "emails/_button.html" with url=link label="View details" %}{% endif %}
{% endblock %}
