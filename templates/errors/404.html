{% extends "base/base.html" %}
{% block title %}Page not found | {{ site.site_name|default:"COZY" }}{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:640px">
  <div class="py-5">
    <span class="eyebrow">Error 404</span>
    <h1>This sparkle went missing</h1>
    <p class="text-muted">The page you're looking for has moved or no longer exists.</p>
    <form class="search-wrap mx-auto my-4" action="{% url 'products:search' %}" method="get"><i class="bi bi-search"></i><input type="search" name="q" class="form-control" placeholder="Search jewellery…"></form>
    <a href="{% url 'home' %}" class="btn btn-cozy">Back to home</a>
  </div>
</div>
{% endblock %}
